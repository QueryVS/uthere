name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Test, package, and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: pytest -q

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          normalized_version="${version}"
          normalized_version="${normalized_version/-beta/b0}"
          normalized_version="${normalized_version/-alpha/a0}"
          normalized_version="${normalized_version/-rc/rc}"
          package_version="$(python -c 'from uthere import __version__; print(__version__)')"
          if [[ "${normalized_version}" != "${package_version}" ]]; then
            echo "Tag version (${version}, normalized: ${normalized_version}) does not match package version (${package_version})." >&2
            exit 1
          fi
          echo "version=${normalized_version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve Docker image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=uthere
            org.opencontainers.image.description=Ping/http health check CLI and service

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Generate packaging files
        run: |
          uthere-packager \
            --version "${{ steps.version.outputs.version }}" \
            --output-dir dist/packages \
            all

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist/release-assets

          git archive \
            --format=tar.gz \
            --prefix="uthere-${version}/" \
            -o "dist/release-assets/uthere-${version}-source.tar.gz" \
            "${GITHUB_REF_NAME}"

          tar -C "dist/packages/debian" \
            -czf "dist/release-assets/uthere-${version}-debian-packaging.tar.gz" \
            "uthere-${version}"

          tar -C "dist/packages/fedora" \
            -czf "dist/release-assets/uthere-${version}-fedora-packaging.tar.gz" \
            "SPECS" "SOURCES"

          tar -C "dist/packages/gentoo" \
            -czf "dist/release-assets/uthere-${version}-gentoo-overlay.tar.gz" \
            "uthere-${version}.ebuild" "files"

          sha256sum dist/release-assets/* > "dist/release-assets/SHA256SUMS"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: uthere ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/release-assets/*
